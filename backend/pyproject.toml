[project]
name = "traid-backend"
version = "0.1.0"
description = "Traid — style-matched token text replacement (local engine + API). Designed & developed by Xavier Sun."
authors = [{ name = "Xavier Sun" }]
readme = "../README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy>=2.1.5",
    "alembic>=1.20.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "PTH", "TID"]
# N818: error classes follow ARCHITECTURE.md §13 names (NotFound, Conflict, …), not *Error.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]  # asserts; dummy password hashes
# Revision files are named 0001_*.py by design.
"app/migrations/versions/*" = ["N999"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
# Revision files start with digits (not importable module names); they are checked by ruff and
# by tests/unit/db/test_migrations.py, which compares them against the ORM models.
exclude = ["app/migrations/versions/"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "models: tests that need downloaded ONNX model files (skipped when absent)",
]
