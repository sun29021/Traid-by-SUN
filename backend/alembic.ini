# Alembic CLI config for development (run from backend/):
#   .venv\Scripts\python.exe -m alembic upgrade head
#   .venv\Scripts\python.exe -m alembic revision -m "describe change"
# The database URL comes from Traid settings (TRAID_DATA_DIR) in app/migrations/env.py.
# The app also runs `upgrade head` automatically on startup.

[alembic]
script_location = %(here)s/app/migrations
file_template = %%(rev)s
prepend_sys_path = .
